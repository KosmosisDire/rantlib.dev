<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}}</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="alternate" type="text/markdown" href="/llms.txt">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <script type="module" src="/main.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand wordmark" href="https://rantlib.dev"><img src="/logo.svg" alt="R">ANT</a>
    <input id="search" type="search" placeholder="Search" aria-label="Search the docs" autocomplete="off">
    <div id="results" aria-live="polite"></div>
    <nav aria-label="Documentation">{{nav}}</nav>
  </aside>
  <main>
    <article>{{content}}</article>
  </main>
</body>
</html>
