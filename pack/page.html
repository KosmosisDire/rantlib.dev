<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Packages for Rant that rant install installs">
  <title>RANT Packages</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <script type="module" src="/main.js"></script>
</head>
<body>
  <!--header-->
  <div class="view">
    <div class="scroll">
      <main>
        <nav class="packages" aria-label="Packages">{{list}}</nav>
      </main>
    </div>
    <aside class="details" aria-label="Package" inert>
      <div class="pane">
        <div class="head">
          <span>Package</span>
          <button class="close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="body">{{details}}</div>
      </div>
    </aside>
  </div>
</body>
</html>
